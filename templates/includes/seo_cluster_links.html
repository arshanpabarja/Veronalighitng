{% if seo_cluster_links %}
  <aside class="border-y border-black/10 bg-[#f7f7f5] py-10 md:py-12" aria-labelledby="seo-cluster-links-heading">
    <div class="mx-auto max-w-6xl px-5 md:px-8">
      <div class="grid gap-8 md:grid-cols-[0.65fr_1.35fr] md:items-start">
        <div>
          <h2 id="seo-cluster-links-heading" class="text-2xl font-semibold leading-tight text-black">
            {{ seo_cluster_links.heading }}
          </h2>
          <p class="mt-3 max-w-xl leading-7 text-black/60">{{ seo_cluster_links.intro }}</p>
        </div>
        <div class="grid gap-3 {% if seo_cluster_links.links|length > 1 %}sm:grid-cols-2{% endif %}">
          {% for link in seo_cluster_links.links %}
            <a href="{{ link.url }}" class="group block border border-black/10 bg-white p-5 transition-colors hover:border-black/35">
              <div class="flex items-start justify-between gap-5">
                <div>
                  <h3 class="font-semibold leading-6 text-black">{{ link.label }}</h3>
                  <p class="mt-2 text-sm leading-6 text-black/60">{{ link.description }}</p>
                </div>
                <span aria-hidden="true" class="text-lg transition-transform group-hover:translate-x-1">→</span>
              </div>
            </a>
          {% endfor %}
        </div>
      </div>
    </div>
  </aside>
{% endif %}
