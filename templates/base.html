{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Verona Lighting{% endblock %}</title>
    <meta name="robots" content="noindex, nofollow">
    {% block meta_tags %}
    <!-- default meta for pages that don't override -->
    <meta name="description" content="Verona Lighting - Premium architectural lighting solutions">
    {% endblock %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>

<style>
/* Default (mobile) */
.main-padding {
    padding-top: 68px;
}

/* Desktop */
@media (min-width: 768px) {
    .main-padding {
        padding-top: 96px;
    }
}

/* Homepage */
.home-page {
    padding-top: 0 !important;
}
</style>

<body class="font-sans">
    <div class="">
        <header> {% include "includes/navbar.html" %} </header>


<main
    class="main-padding"
    style="{% if request.path == '/' %}padding-top:0;{% endif %}"
>
    {% block content %}
    {% endblock %}
</main>


        {% include "includes/footer.html" %}

    </div>
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
